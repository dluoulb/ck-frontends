volumes:
  ck-market-api-pg:

networks:
  ck-eco-net:
    external: true

secrets:
  app-env:
    file: ./deploy/.env.aws.secrets
  fontawesome-npm-auth-token:
    environment: FONTAWESOME_NPM_AUTH_TOKEN

services:
  ck-frontends:
    build:
      target: dev
      context: .
      secrets:
        - fontawesome-npm-auth-token
    ports:
      - 3000
    volumes:
      - ./.npmrc:/app/.npmrc
      - ./globals.css:/app/globals.css
      - ./middleware.ts:/app/middleware.ts
      - ./instrumentation-client.ts:/app/instrumentation-client.ts
      - ./next.config.js:/app/next.config.js
      - ./next-env.d.ts:/app/next-env.d.ts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./eslint.config.mjs:/app/eslint.config.mjs
      - ./.prettierrc:/app/.prettierrc
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./shared:/app/shared
      - ./apps:/app/apps
      - ./types:/app/types
      - ./pages:/app/pages
      - ./public:/app/public
      - ./__tests__:/app/__tests__
      - ./jest.config.ts:/app/jest.config.ts
      - ./jest.setup.ts:/app/jest.setup.ts
    env_file:
      - path: ./.env.docker
        required: true
      - path: ./.env.docker.overrides
        required: false
    labels:
      traefik.enable: true
      traefik.http.routers.ck-frontends.entrypoints: web
      traefik.http.routers.ck-frontends.rule: 'Host(`${VHOST_CK_FRONTENDS}`,`${VHOST_CK_BORROWER}`,`${VHOST_CK_REPORTS}`,`${VHOST_CK_ADMIN}`)'
    networks:
      - ck-eco-net
    dns:
      - ${CK_DNSMASQ_IP}

  ck-frontends-deployed:
    profiles:
      - deployed
    build:
      context: .
      secrets:
        - app-env
        - fontawesome-npm-auth-token
    environment:
      BYPASS_AUTH: 1
    ports:
      - 3000
    labels:
      traefik.enable: true
      traefik.http.routers.ck-frontends.entrypoints: web
      traefik.http.routers.ck-frontends.rule: 'Host(`${VHOST_CK_FRONTENDS}`, `${VHOST_CK_BORROWER}`,`${VHOST_CK_REPORTS}`,`${VHOST_CK_ADMIN}`,`${VHOST_CK_APPLY}`)'
    volumes:
      - ./deploy/bin/entrypoint.sh:/usr/local/bin/entrypoint.sh
    networks:
      - ck-eco-net
    dns:
      - ${CK_DNSMASQ_IP}
