image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 3072

  caches:
    apt-lists: /var/lib/apt/lists
    apt-cache: /var/cache/apt

  steps:
    - step: &Deploy-step
        name: Deploy
        services:
          - docker
        caches:
          - apt-lists
          - apt-cache
          - docker
        script:
          - ./deploy/ck-ecs.sh deploy $DEPLOY_TIER

    - step: &Autodeploy-step
        name: Auto Deploy
        services:
          - docker
        caches:
          - apt-lists
          - apt-cache
          - docker
        script:
          - ./deploy/ck-ecs.sh autodeploy $DEPLOY_TIER

pipelines:
  branches:
    master:
      - step:
          <<: *Deploy-step
          deployment: staging

  custom:
    # release-development:
    #   - step:
    #       <<: *Deploy-step
    #       deployment: development

    autodeploy-staging:
      - step:
          <<: *Autodeploy-step
          deployment: staging

    release-staging:
      - step:
          <<: *Deploy-step
          deployment: staging

    autodeploy-production:
      - step:
          <<: *Autodeploy-step
          deployment: production

    release-production:
      - step:
          <<: *Deploy-step
          deployment: production

