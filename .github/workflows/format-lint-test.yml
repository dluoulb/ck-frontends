name: Format/Lint/Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container   # important, enables cache export

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: |
            ghcr.io/${{ github.repository }}/testing:latest
            ghcr.io/${{ github.repository }}/testing:${{ github.sha }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/testing:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/testing:buildcache,mode=max
          build-args: |
            APP_VERSION=development
            FONTAWESOME_NPM_AUTH_TOKEN=${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

  format:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/${{ github.repository }}/testing:${{ github.sha }}
    steps:
      - name: Run format check
        working-directory: /app
        run: npm run format:check

  lint:
    if: true == false  # Temporarily disabled
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/${{ github.repository }}/testing:${{ github.sha }}
    steps:
      - name: Run lint
        working-directory: /app
        run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: ghcr.io/${{ github.repository }}/testing:${{ github.sha }}
    steps:
      - name: Run tests
        working-directory: /app
        run: npm run test
