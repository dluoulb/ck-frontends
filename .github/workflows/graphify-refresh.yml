name: Refresh Graphify graph

on:
  workflow_dispatch:
  schedule:
    - cron: "40 1 * * *"
      timezone: America/New_York

jobs:
  refresh:
    if: ${{ github.event_name != 'schedule' || vars.GRAPHIFY_REFRESH_ENABLED == 'true' }}
    permissions:
      contents: read
    uses: creditkey/ck-github-actions/.github/workflows/graphify-refresh.yml@eab9b0b116cb5d1092c4904fd530ceef33f4f3eb
    secrets:
      CK_GRAPHIFY_APP_PRIVATE_KEY: ${{ secrets.CK_GRAPHIFY_APP_PRIVATE_KEY }}
    with:
      graphify_version: graphifyy[sql,terraform]==0.9.46
      max_graph_mb: 80
      warn_graph_mb: 50
      query_smoke: What are the main architecture components and how do they relate?
